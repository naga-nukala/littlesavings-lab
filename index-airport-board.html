<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Savings Lab | Departure Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#080c0e; --board:#11181a; --tile:#252d2f; --tile-top:#303b3d; --ink:#f1f3e9; --muted:#879493; --line:#334042; --mint:#a9e6bf; --amber:#ffc96b; --coral:#ff806f; }
* { box-sizing:border-box; }
body { margin:0; min-width:320px; color:var(--ink); font-family:"DM Mono",monospace; background:radial-gradient(circle at 50% -10%,#394a43 0,transparent 35%),var(--bg); }
.shell { width:min(1180px,calc(100% - 36px)); margin:0 auto; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:26px 0; font-family:"Space Grotesk",sans-serif; }
.brand { color:var(--ink); text-decoration:none; font-weight:700; letter-spacing:-.04em; }
.brand span { color:var(--amber); }
.topbar a:last-child { color:var(--muted); text-decoration:none; font:12px "DM Mono",monospace; border-bottom:1px solid var(--line); padding-bottom:4px; }
.topbar a:last-child:hover { color:var(--mint); border-color:var(--mint); }
.hero { padding:43px 0 35px; }
.eyebrow { color:var(--mint); font-size:11px; letter-spacing:.16em; text-transform:uppercase; }
h1 { max-width:780px; margin:14px 0 15px; font:700 clamp(40px,6vw,76px)/.95 "Space Grotesk",sans-serif; letter-spacing:-.08em; }
h1 span { color:var(--amber); }
.lede { max-width:560px; color:var(--muted); font-size:13px; line-height:1.7; }
.board-frame { padding:15px; border:1px solid var(--line); border-radius:8px; background:#0d1315; box-shadow:0 25px 70px #0009,0 0 0 1px #ffffff08 inset; }
.board-header, .board-row { display:grid; grid-template-columns:minmax(0,1fr) 160px 100px; gap:16px; align-items:center; }
.board-header { padding:0 16px 12px; color:var(--muted); font-size:10px; letter-spacing:.13em; text-transform:uppercase; }
.board-row { position:relative; min-height:82px; padding:13px 16px; border-top:1px solid #ffffff0b; text-decoration:none; color:var(--ink); transition:background .25s ease,transform .25s ease; }
.board-row:hover { z-index:2; background:#1b2829; transform:translateX(5px); }
.board-row::before { content:""; position:absolute; left:0; top:50%; width:3px; height:0; background:var(--mint); transition:height .25s ease; transform:translateY(-50%); }
.board-row:hover::before { height:45px; }
.tool-name { font:600 16px "Space Grotesk",sans-serif; letter-spacing:-.035em; }
.tool-desc { margin-top:5px; color:var(--muted); font-size:11px; }
.category { color:var(--amber); font-size:10px; line-height:1.4; text-transform:uppercase; }
.status { justify-self:end; display:flex; align-items:center; gap:7px; color:var(--mint); font-size:10px; text-transform:uppercase; }
.status i { width:6px; height:6px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 4px #a9e6bf18; animation:blink 1.8s ease-in-out infinite; }
@keyframes blink { 50% { opacity:.3; box-shadow:0 0 0 7px transparent; } }
.split { display:inline-flex; vertical-align:middle; margin-right:8px; gap:3px; }
.tile { display:grid; place-items:center; width:20px; height:27px; overflow:hidden; border:1px solid #3b4749; border-radius:2px; color:var(--ink); background:linear-gradient(#303a3c 0 49%,#171e20 50% 100%); box-shadow:0 2px 0 #0008; font-size:14px; }
.tile.animate { animation:flip .5s cubic-bezier(.2,.75,.25,1) both; }
@keyframes flip { 0% { transform:rotateX(0); } 48% { transform:rotateX(-90deg); opacity:.35; } 100% { transform:rotateX(0); opacity:1; } }
.footer { display:flex; justify-content:space-between; gap:20px; padding:25px 0 35px; color:var(--muted); font-size:11px; }
.footer strong { color:var(--ink); font-weight:400; }
@media (max-width:700px) { .shell { width:calc(100% - 24px); } .topbar { padding:18px 0; } .topbar a:last-child { display:none; } .board-header { display:none; } .board-row { grid-template-columns:minmax(0,1fr) 78px; gap:10px; padding:14px 10px; } .category { grid-column:2; grid-row:1; } .status { grid-column:2; grid-row:2; } .tool-name { font-size:14px; } .tool-desc { font-size:10px; line-height:1.45; } .tile { width:17px; height:24px; font-size:12px; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<header class="shell topbar"><a class="brand" href="index.html">LITTLE <span>//</span> SAVINGS LAB</a><a href="index-cards-rotator.html">View card rotator</a></header>
<main class="shell">
  <section class="hero"><div class="eyebrow">Live personal finance departures</div><h1>Choose your next <span>destination.</span></h1><p class="lede">An airport departure board for your money decisions. Every tool is ready for boarding. Select a row to open it.</p></section>
  <section class="board-frame" aria-label="Savings tools departure board"><div class="board-header"><span>Destination / tool</span><span>Terminal</span><span>Status</span></div><div id="board"></div></section>
</main>
<footer class="shell footer"><span>BOARD UPDATED <strong id="clock"></strong></span><span>18 TOOLS / ALL SYSTEMS READY</span></footer>
<script>
const tools = [
  ["Flat Buying Scorecard","flat-scorecard.html","🏠","Big decisions"],["Bike/Car Ownership Cost","vehicle-cost-calculator.html","🏍️","Big decisions"],["Insurance Coverage Checker","insurance-coverage-checker.html","🛡️","Big decisions"],["Emergency Fund Calculator","emergency-fund-calculator.html","🛟","Big decisions"],["Mobile Cost & RC Calculator","mobile-cost-calculator.html","📱","Monthly bills"],["Multi-SIM Tracker","sim-tracker.html","📶","Monthly bills"],["Internet Cost Comparator","internet-cost-comparator.html","📡","Monthly bills"],["OTT Rotation Tracker","ott-rotation-tracker.html","📺","Monthly bills"],["Bank Fees & Card Tracker","bank-fees-tracker.html","🏦","Banking & cards"],["Credit Card Cashback Calculator","cc-cashback-calculator.html","💸","Banking & cards"],["CASA vs Rupay CC Savings","casa-rupay-calculator.html","💳","Banking & cards"],["Gift Card Savings Calculator","gift-card-calculator.html","🎁","Banking & cards"],["Price Comparator","price-comparator.html","🛒","Shopping & health"],["DMart Shopping Checklist","dmart-checklist.html","🧺","Shopping & health"],["Medicine & Lab Test Comparator","medicine-lab-comparator.html","💊","Shopping & health"],["Money Framework Dashboard","money-framework-dashboard.html","📊","Planning"],["Travel Mode Comparator","travel-mode-comparator.html","🚆","Planning"],["Yield Stack","yield-stack.html","📈","Planning"]
];
const board = document.getElementById("board");
function tiles(text, index) { return [...text.slice(0, 3)].map((char, tileIndex) => `<span class="tile" style="animation-delay:${(index * 35) + tileIndex * 65}ms">${char}</span>`).join(""); }
board.innerHTML = tools.map((tool, index) => `<a class="board-row" href="${tool[1]}"><div><div class="tool-name"><span class="split">${tiles(tool[2], index)}</span>${tool[0]}</div><div class="tool-desc">Open calculator / tracker</div></div><div class="category">${tool[3]}</div><div class="status"><i></i>Ready</div></a>`).join("");
function animateTiles() { document.querySelectorAll(".tile").forEach(tile => { tile.classList.remove("animate"); void tile.offsetWidth; tile.classList.add("animate"); }); }
function updateClock() { document.getElementById("clock").textContent = new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" }); }
animateTiles(); updateClock(); setInterval(() => { animateTiles(); updateClock(); }, 7000);
</script>
</body>
</html>
