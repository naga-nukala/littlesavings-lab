<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTT Rotation Tracker</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--acc:#22c55e;--warn:#f59e0b;--bad:#ef4444;--txt:#e2e8f0;--sub:#94a3b8;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:20px;}
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:20px;margin-bottom:4px;}
  p.sub{color:var(--sub);font-size:13px;margin-top:0;margin-bottom:20px;}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;}
  .summary{display:flex;gap:10px;}
  .summary .box{flex:1;text-align:center;background:#0f172a;border-radius:10px;padding:14px;}
  .summary .n{font-size:22px;font-weight:800;}
  .summary .l{font-size:11px;color:var(--sub);margin-top:2px;}

  .item{border-bottom:1px solid #334155;padding-bottom:14px;margin-bottom:14px;}
  .item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .name-row{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
  .name-row input.name{font-weight:700;font-size:15px;flex:1;}
  .toggle{display:flex;align-items:center;gap:6px;}
  .toggle input{width:auto;}
  .remove-btn{background:none;border:none;color:var(--bad);font-size:14px;cursor:pointer;}
  .row{display:flex;gap:8px;margin-bottom:8px;}
  .field{flex:1;}
  label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;}
  input, select{width:100%;padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--txt);font-size:13px;}
  input:focus, select:focus{outline:2px solid var(--acc);}
  .status-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;}
  .active-badge{background:rgba(34,197,94,.15);color:var(--acc);}
  .paused-badge{background:rgba(148,163,184,.15);color:var(--sub);}

  button.add{width:100%;padding:12px;border:1px dashed #475569;border-radius:10px;background:transparent;color:var(--txt);font-size:14px;cursor:pointer;margin-bottom:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📺 OTT Rotation Tracker</h1>
  <p class="sub">Only run 1-2 OTTs at a time. Finish the watchlist, pause, rotate to the next.</p>

  <div class="card">
    <div class="summary">
      <div class="box"><div class="n" id="activeSpend">₹0</div><div class="l">Active Spend/mo</div></div>
      <div class="box"><div class="n" id="allSpend">₹0</div><div class="l">If All Active/mo</div></div>
      <div class="box"><div class="n" id="saved" style="color:var(--acc);">₹0</div><div class="l">Saved by Rotating</div></div>
    </div>
  </div>

  <div class="card" id="ottContainer"></div>
  <button class="add" onclick="addOTT()">+ Add OTT Platform</button>
</div>

<script>
let platforms = [
  {name:'Amazon Prime', cost:299, active:true, watchlist:''},
  {name:'Netflix', cost:499, active:false, watchlist:''},
];

function addOTT(){
  platforms.push({name:'', cost:0, active:false, watchlist:''});
  render();
}
function removeOTT(i){
  platforms.splice(i,1);
  render();
}
function updateField(i, field, val){
  if(field==='active'){ platforms[i].active = val; }
  else if(field==='name' || field==='watchlist'){ platforms[i][field] = val; }
  else { platforms[i][field] = parseFloat(val)||0; }
  updateInPlace(i);
  updateSummary();
}

function updateInPlace(i){
  const div = document.querySelector(`[data-index="${i}"]`);
  if(!div) return;
  const p = platforms[i];
  const badge = div.querySelector('[data-role="badge"]');
  if(badge){
    badge.className = 'status-badge ' + (p.active ? 'active-badge' : 'paused-badge');
    badge.textContent = p.active ? 'Active' : 'Paused';
  }
}

function updateSummary(){
  const activeSpend = platforms.filter(p=>p.active).reduce((s,p)=>s+p.cost,0);
  const allSpend = platforms.reduce((s,p)=>s+p.cost,0);
  document.getElementById('activeSpend').textContent = '₹'+activeSpend.toFixed(0);
  document.getElementById('allSpend').textContent = '₹'+allSpend.toFixed(0);
  document.getElementById('saved').textContent = '₹'+(allSpend-activeSpend).toFixed(0);
}

function render(){
  const container = document.getElementById('ottContainer');
  container.innerHTML = '';
  platforms.forEach((p,i)=>{
    const div = document.createElement('div');
    div.className = 'item';
    div.dataset.index = i;
    div.innerHTML = `
      <div class="name-row">
        <input class="name" placeholder="Platform name" value="${p.name}" oninput="updateField(${i},'name',this.value)">
        <span class="status-badge ${p.active?'active-badge':'paused-badge'}" data-role="badge">${p.active?'Active':'Paused'}</span>
        <button class="remove-btn" onclick="removeOTT(${i})">✕</button>
      </div>
      <div class="row">
        <div class="field"><label>Monthly Cost (₹)</label><input type="number" value="${p.cost}" oninput="updateField(${i},'cost',this.value)"></div>
        <div class="field"><label>Status</label>
          <div class="toggle" style="padding-top:8px;">
            <input type="checkbox" id="active-${i}" ${p.active?'checked':''} onchange="updateField(${i},'active',this.checked)">
            <label for="active-${i}" style="margin:0;">Currently Active</label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>Watchlist / What's Pending</label><input type="text" placeholder="e.g. Finish Season 2" value="${p.watchlist}" oninput="updateField(${i},'watchlist',this.value)"></div>
      </div>
    `;
    container.appendChild(div);
  });

  const activeSpend = platforms.filter(p=>p.active).reduce((s,p)=>s+p.cost,0);
  const allSpend = platforms.reduce((s,p)=>s+p.cost,0);
  document.getElementById('activeSpend').textContent = '₹'+activeSpend.toFixed(0);
  document.getElementById('allSpend').textContent = '₹'+allSpend.toFixed(0);
  document.getElementById('saved').textContent = '₹'+(allSpend-activeSpend).toFixed(0);
}

render();
</script>
</body>
</html>
